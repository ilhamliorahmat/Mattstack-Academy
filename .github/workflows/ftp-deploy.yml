name: 🚀 Automated FTP Deployment to Web Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🔨 Build Vanilla Web Bundle & FTP Upload
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Project Dependencies
        run: npm ci

      - name: 🏗️ Build Production Bundle
        run: npm run build

      - name: 🚀 Sync Production Assets to Remote FTP Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ fromJSON(secrets.FTP_CRED).server }}
          username: ${{ fromJSON(secrets.FTP_CRED).username }}
          password: ${{ fromJSON(secrets.FTP_CRED).password }}
          server-dir: ${{ fromJSON(secrets.FTP_CRED).server_dir || 'mattstack.xo.je/htdocs/' }}
          port: ${{ fromJSON(secrets.FTP_CRED).port || 21 }}
          protocol: ${{ fromJSON(secrets.FTP_CRED).protocol || 'ftp' }}
          local-dir: './dist/'
          dangerous-clean-slate: false
